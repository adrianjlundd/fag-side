'use strict';
const data = {"en": {"slug": "transformasjoner", "title": "Geometric transformations", "intro": "A vertex has coordinates in the object's own coordinate system. The model matrix determines where that vertex ends up when the object is placed in the world.", "focus": ["Construct a 2D or 3D matrix from a description, and trace a vertex through the matrix product.", "Rotate about a chosen point. Check the signs, the fixed point and the directions of the axes.", "Count scalar multiplications for many vertices, both with and without a precomputed matrix product."], "sections": [{"id": "vektorer", "title": "Working with points, vectors and bases", "source": "CGVIZ_Chapter_3_2022.pdf p. 2–17 and 72–80 · Transformations.pdf § 1.1–1.3", "html": "<p>A point specifies a position, whereas a vector specifies a displacement. From A=(1,1) to B=(4,5), the vector is v=B−A=(3,4). Use the Pythagorean theorem to find its length: √(3²+4²)=5. The unit vector v/5=(0,6;0,8) points in the same direction and has length one. The zero vector has no unique direction and cannot be normalised.<\/p><p>A dot product adds the products of corresponding components. With the unit vector e=(1,0) along the rightward axis, v·e=3. This is the signed component of v along that axis. For two unit vectors, the dot product gives the cosine of the angle between them: 1 for the same direction, 0 for a right angle and −1 for opposite directions. In a right-handed 3D coordinate system, the cross product gives a vector perpendicular to both input vectors. The order of the inputs determines its sign.<\/p><p>You can read the columns of a matrix as basis vectors. For the basis b₁=(0,1), b₂=(−1,0), the local coordinates (2,3) describe the world-space vector 2b₁+3b₂=(−3,2). If the basis is orthonormal, you can recover the local coordinates by taking dot products with the two basis vectors.<\/p>\n<details class=\"sjekk\"><summary>Basic practice · How do you check that a vector is normalised?<\/summary><p>Take its dot product with itself.<\/p><details><summary>Show answer<\/summary><p>For (0,6;0,8), the calculation gives 0,36 + 0,64 = 1. A squared length of one means that the vector has unit length.<\/p><\/details><\/details>\n<div class=\"exercise\"><strong>Application · our practice exercise<\/strong><p>A triangle has vertices A=(0,0,0), B=(2,0,0), C=(0,3,0). Find a unit normal. What happens if you reverse the vertex order?<\/p><details><summary>Hint<\/summary><p>Use (B−A) × (C−A), then divide by its length.<\/p><\/details><details><summary>Show answer<\/summary><p>The cross product is (0,0,2·3−0·0)=(0,0,6). Normalising gives (0,0,1). If you swap B and C, the normal points down along −z. Collinear vertices would give the zero vector, with no unique surface normal.<\/p><\/details><\/div>"}, {"id": "koordinater", "title": "Points, directions and an extra coordinate", "source": "Transformations.pdf § 1.1–1.5, PDF p. 3–15 · CGVIZ_Chapter_3_2022.pdf p. 3–31", "html": "\n<p>The vector from A to B is the difference B − A. Translate both endpoints by the same amount, and the difference stays the same. In <dfn>homogeneous coordinates<\/dfn>, a 2D point takes the form [x, y, 1]ᵀ and a direction takes the form [u, v, 0]ᵀ. In 3D, insert z before the final coordinate.<\/p>\n<p>Use column vectors. The rows of an affine 2D matrix can be written as [a, b, tₓ], [c, d, tᵧ], [0, 0, 1]. The transformed point has x′ = ax + by + tₓ and y′ = cx + dy + tᵧ. The translation terms disappear when the final coordinate is 0.<\/p>\n<p><strong>Work through the calculation yourself.<\/strong> For the point (2,4) with homogeneous coordinate one, we obtain <math display=\"block\"><mo>[<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>−1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>4<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>=<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>7<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><\/math> The direction (2, 4) is mapped to (4, 4). An <dfn>affine transformation<\/dfn> preserves midpoints, among other properties. General scaling can change both lengths and angles.<\/p>\n<p>A cube with eight distinct vertices has a 4 × 8 vertex matrix, with one homogeneous point per column. Scaling by (2, 3, 4) uses a 4 × 4 matrix with diagonal (2, 3, 4, 1) and zeros elsewhere. A translation matrix has ones on the diagonal and the displacement (tₓ, tᵧ, t<sub>z<\/sub>) in the top three entries of the final column. The product M · vertex matrix still has four rows and eight columns. All w-values remain 1 under these affine operations.<\/p>\n<p>You can construct an affine matrix by asking where the origin and the two basis vectors are mapped. The first two columns are the transformed basis vectors. The final column is the image of the origin. This gives you a geometric check on every coefficient.<\/p>\n<details class=\"sjekk\"><summary>Basic practice · How do you represent a direction?<\/summary><p>Subtract one homogeneous point from another.<\/p><details><summary>Show answer<\/summary><p>[4,3,1]ᵀ − [1,2,1]ᵀ = [3,1,0]ᵀ. A final coordinate of zero makes the direction unaffected by translation.<\/p><\/details><\/details>\n<div class=\"exercise\"><strong>Application · our practice exercise<\/strong><p>A transformation maps the origin to (4, −2), the unit vector along x to (0, 2), and the unit vector along y to (−1, 0). Where does the point (3, 1) end up?<\/p>\n<details><summary>Hint<\/summary><p>Start at the transformed origin. Then take three steps along the new x-direction and one along the new y-direction.<\/p><\/details>\n<details><summary>Show answer<\/summary><p>(4, −2) + 3(0, 2) + (−1, 0) = (3, 4). The direction (3, 1) on its own would map to (−1, 6). The difference is exactly the translation.<\/p><\/details><\/div>"}, {"id": "rekkefolge", "title": "Which operation comes first?", "source": "CGVIZ_Chapter_3_2022.pdf p. 10–20, 26–31 and 48–55 · CGVIZ_Chapter_5_2026.pdf p. 12–19", "html": "\n<p>S denotes scaling, R rotation and T translation. With x pointing right and y pointing up, positive rotation is counterclockwise when viewed from positive z towards the origin. Rotation in the xy-plane gives x′ = x cos θ − y sin θ and y′ = x sin θ + y cos θ. At +90°, this becomes (−y, x). In 3D, R<sub>z<\/sub> leaves z unchanged.<\/p>\n<p>Scale (1, 2) by the factors (2, 3), rotate by +90°, and translate by (4, 1). Trace the point: (1, 2) → (2, 6) → (−6, 2) → (−2, 3). The product is M = T R S. The rightmost matrix acts on the point first.<\/p>\n<p>Check the complete matrix: (x, y) → (2x, 3y) → (−3y, 2x) → (4 − 3y, 1 + 2x). Read off the rows of M as [0, −3, 4], [2, 0, 1], [0, 0, 1]. The inverse transformation is S⁻¹ R⁻¹ T⁻¹. Try applying it to the result.<\/p>\n<p>To place an already scaled vertex Q = (4, 3) at the target G = (1, 8), find the displacement G − Q = (−3, 5) and apply it to every vertex. Reflection across the x-axis, by contrast, is scaling by (1, −1). A shear along x, x′ = x + ky, y′ = y, maps (1, 2) to (5, 2) when k = 2.<\/p>\n<div data-demo=\"transformasjon\"><\/div>\n<aside class=\"worked-example\" lang=\"en\"><h3>Compose a model matrix<\/h3><p>Start with a column point (1, 2). Scale by (2, 3), rotate counterclockwise by 90°, then translate by (4, 1). Reading the operations from the point outward gives M = TRS. The translation occupies the last column because it multiplies the homogeneous coordinate.<\/p>\n<div class=\"calculation\"><math display=\"block\"><mo>[<\/mo><mtable><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>-3<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>=<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>-2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><\/math><\/div><p>What changes if the input is a direction?<\/p><details><summary>Check your reasoning<\/summary><p>Set w = 0. Row one gives −3 × 2 = −6 and row two gives 2 × 1 = 2. Translation disappears, so the direction is (−6, 2).<\/p><\/details><\/aside>\n<p>A matrix acts in the coordinate system in which its input vector is expressed. Translating an object before scaling therefore also scales its displacement from the origin. If the stated transformations are easy to confuse, test their order on the origin.<\/p>\n<details class=\"sjekk\"><summary>Basic practice · Which matrix acts first in RS?<\/summary><p>Put parentheses around the product that acts directly on the point.<\/p><details><summary>Show answer<\/summary><p>(RS)p = R(Sp). S acts first.<\/p><\/details><\/details>\n<div class=\"exercise\"><strong>Application · our practice exercise<\/strong><p>Scale x by 3, then translate by 2 along x. What value does the point with x = 1 have when you use the intended order, and when you reverse it?<\/p>\n<details><summary>Hint<\/summary><p>Write the two functions as s(x) and t(x).<\/p><\/details>\n<details><summary>Show answer<\/summary><p>t(s(1)) = 3 + 2 = 5. s(t(1)) = 3(1 + 2) = 9. With column vectors, the first composition is TS. Its inverse must first subtract 2, then divide by 3.<\/p><\/details><\/div>"}, {"id": "pivot", "title": "Rotation about a different centre", "source": "Transformations.pdf § 1.6 and § 1.8, PDF p. 15–17 and 29–36 · CGVIZ_Chapter_3_2022.pdf p. 32–35 and 67–80", "html": "\n<p>A <dfn>centre of rotation<\/dfn> C must stay fixed. Translate C to the origin using T(−C), rotate there, then translate back. The formula for a point is <math><mi mathvariant=\"bold\">p′<\/mi><mo>=<\/mo><mi mathvariant=\"bold\">C<\/mi><mo>+<\/mo><mi mathvariant=\"bold\">R<\/mi><mo>(<\/mo><mi mathvariant=\"bold\">p<\/mi><mo>−<\/mo><mi mathvariant=\"bold\">C<\/mi><mo>)<\/mo><\/math>. The matrix is T(C) R T(−C).<\/p>\n<p>Rotate (5, 3) <em>clockwise<\/em> about (2, 2). The relative position is (3, 1). At −90°, (x, y) becomes (y, −x), giving (1, −3). Add (2, 2) back to obtain (3, −1). Check that C itself gives zero in the middle step.<\/p>\n<p>For an axis parallel to z, use the same procedure and leave z unchanged. For an arbitrary 3D axis through C, a rotation A can first align the axis with z. The complete product is T(C) A⁻¹ R<sub>z<\/sub>(θ) A T(−C). When rotation follows scaling, use the centre expressed in the coordinate system specified for the rotation step.<\/p>\n<p>Subtract the pivot from every point before rotating. The difference is then a direction measured from the pivot. After rotating, add the pivot back in the same coordinate system. Both the pivot position and the distance to it must be preserved.<\/p>\n<details class=\"sjekk\"><summary>Basic practice · Where should the pivot point end up?<\/summary><p>Substitute p = C into C + R(p − C).<\/p><details><summary>Show answer<\/summary><p>The difference is zero, so the output is C. Any other result reveals an incorrect order or sign.<\/p><\/details><\/details>\n<div class=\"exercise\"><strong>Application · our practice exercise<\/strong><p>Rotate P = (3, 4) about C = (2, 2) by 90° clockwise. Check your answer without applying the matrix again.<\/p>\n<details><summary>Hint<\/summary><p>A clockwise quarter-turn maps (u, v) to (v, −u).<\/p><\/details>\n<details><summary>Show answer<\/summary><p>The difference (1, 2) becomes (2, −1). Add C to obtain (4, 1). The squared distance to C is 1² + 2² = 5 before the rotation and 2² + (−1)² = 5 afterwards.<\/p><\/details><\/div>"}, {"id": "akse", "title": "Rotating about an arbitrary axis", "source": "CGVIZ_Chapter_3_2022.pdf p. 66–80 · Transformations.pdf § 1.7", "html": "<p>An axis in space requires both a point C and a direction n. Choose a local orthonormal basis whose third axis lies along n. With the basis vectors as columns, B maps local coordinates to world coordinates. Bᵀ does the reverse because the axes are orthonormal. To construct the other axes using cross products, choose a helper vector that is not parallel to n.<\/p><p>Translate relative to C, change basis, rotate about local z, change back, and add C. This gives C + B R<sub>z<\/sub>(θ) Bᵀ(p−C). For the world x-axis, you can choose the local basis (world y, world z, world x). With C=(1,1,0), p=(1,2,0), the difference p−C is one unit along local x. A positive quarter-turn gives one unit along local y, which is world +z. The result is (1,1,1).<\/p>\n<details class=\"sjekk\"><summary>Basic practice · Why normalise the rotation axis?<\/summary><p>Compare n and 3n as geometric axes.<\/p><details><summary>Show answer<\/summary><p>Both point along the same axis. Unit length makes the change of basis orthonormal, without scaling space.<\/p><\/details><\/details>\n<div class=\"exercise\"><strong>Application · our practice exercise<\/strong><p>What happens to the point (4,1,0) on the same axis?<\/p><details><summary>Hint<\/summary><p>Calculate its components relative to C.<\/p><\/details><details><summary>Show answer<\/summary><p>The difference is 3n, which is (0,0,3) in the local basis. Rotation about local z leaves it unchanged. The result is (4,1,0) for any angle.<\/p><\/details><\/div>"}, {"id": "kostnad", "title": "One matrix for all the vertices", "source": "Transformations.pdf § 1.4 and § 1.12, PDF p. 10–12 and 46–47 · CGVIZ_Chapter_3_2022.pdf p. 18–20", "html": "\n<p>Multiplying a dense 4 × 4 matrix by one 4-component vector requires 4 · 4 = 16 scalar multiplications. Forming the product of two dense 4 × 4 matrices requires 4 · 4 · 4 = 64. These counts include multiplications by zeros and ones.<\/p>\n<p>For 20 vertices and two transformations, applying the matrices separately costs 20 · 2 · 16 = 640. Precomputing their product costs 64 + 20 · 16 = 384. The transformation order is identical. Reusing the same product saves 256 multiplications. For N vertices, precomputation pays off when 64 + 16N &lt; 32N, that is, N &gt; 4.<\/p>\n<p>Precomputation has a one-time cost and a saving per vertex. Compare them separately. If a new model matrix is needed for every animation frame, the one-time cost is incurred once per frame.<\/p>\n<details class=\"sjekk\"><summary>Basic practice · How many products are needed for one output row?<\/summary><p>Count the pairs of components in a dense 4-component vector.<\/p><details><summary>Show answer<\/summary><p>One row requires four products. Four rows require 16 in total.<\/p><\/details><\/details>\n<div class=\"exercise\"><strong>Application · our practice exercise<\/strong><p>How many vertices must share two dense 4 × 4 matrices before composing the matrices strictly reduces the number of multiplications?<\/p>\n<details><summary>Hint<\/summary><p>Compare 64 + 16n with 32n.<\/p><\/details>\n<details><summary>Show answer<\/summary><p>64 + 16n &lt; 32n gives n &gt; 4. At four vertices, the counts are equal. At five, the counts are 144 versus 160 multiplications. This calculation assumes dense multiplication, without special treatment of zeros.<\/p><\/details><\/div>"}], "question": "Scale P = (3, 1) by (2, 1), then rotate it by +90° about C = (2, 0). Find the final point and write the matrix factors in the correct order.", "hint": "First find the scaled point. Subtract C before rotating.", "answer": "Scaling gives (6, 1). Relative to C, this is (4, 1). The quarter-turn gives (−1, 4). Add C to obtain (1, 4). The matrix product is T(C) R(+90°) T(−C) S.", "terms": {"homogeneous coordinates": "An extra coordinate w makes it possible to express translation as matrix multiplication, among other uses. For w ≠ 0, divide the other coordinates by w to obtain ordinary coordinates.", "affine transformation": "A mapping p′ = Ap + t. A straight line maps to a line or, in a degenerate case, a point.", "centre of rotation": "The point about which a 2D rotation takes place. Its position stays fixed."}}, "nb": {"slug": "transformasjoner", "title": "Geometriske transformasjoner", "intro": "Et hjørne har koordinater i objektets eget system. Modellmatrisen bestemmer hvor hjørnet havner når objektet plasseres i verden.", "focus": ["Skriv en 2D- eller 3D-matrise fra en beskrivelse, og følg ett hjørne gjennom produktet.", "Roter om et valgt punkt. Kontroller fortegn, fast punkt og akseretning.", "Tell skalare multiplikasjoner for mange hjørner, med og uten forhåndsberegnet produkt."], "sections": [{"id": "vektorer", "title": "Regn med punkter, vektorer og basis", "source": "CGVIZ_Chapter_3_2022.pdf s. 2–17 og 72–80 · Transformations.pdf § 1.1–1.3", "html": "<p>Et punkt angir et sted, og en vektor angir en endring. Fra A=(1,1) til B=(4,5) er vektoren v=B−A=(3,4). Lengden finnes med Pytagoras: √(3²+4²)=5. Enhetsretningen v/5=(0,6;0,8) peker samme vei og har lengde én. Nullvektoren mangler entydig retning og kan ikke normaliseres.<\/p><p>Et skalarprodukt summerer parvise komponentprodukter. Med høyre enhetsakse e=(1,0) gir v·e=3. Dette er v sin signerte komponent langs aksen. For to enhetsretninger gir skalarproduktet cosinus til vinkelen: 1 for samme retning, 0 for rett vinkel og −1 for motsatt retning. I et høyrehendt 3D-system gir kryssproduktet en vektor vinkelrett på de to inngangene. Rekkefølgen avgjør fortegnet.<\/p><p>En matrise kan leses som kolonner med basisretninger. Har du basis b₁=(0,1), b₂=(−1,0), beskriver lokale koordinater (2,3) vektoren 2b₁+3b₂=(−3,2) i verden. For en ortonormal basis kan du lese av koordinatene tilbake med skalarprodukter med de to basisvektorene.<\/p>\n          <details class=\"sjekk\"><summary>Grunnøving · Hvordan sjekker du at en vektor er normalisert?<\/summary><p>Beregn dens skalarprodukt med seg selv.<\/p><details><summary>Se svar<\/summary><p>For (0,6;0,8) gir 0,36 + 0,64 = 1. Kvadrert lengde én betyr enhetslengde.<\/p><\/details><\/details>\n          <div class=\"exercise\"><strong>Anvendelse · egen treningsoppgave<\/strong><p>En trekant har hjørner A=(0,0,0), B=(2,0,0), C=(0,3,0). Finn en enhetsnormal. Hva om hjørnerekkefølgen snus?<\/p><details><summary>Hint<\/summary><p>Bruk (B−A) × (C−A), og del deretter på lengden.<\/p><\/details><details><summary>Se svar<\/summary><p>Kryssproduktet er (0,0,2·3−0·0)=(0,0,6). Normalisering gir (0,0,1). Bytter du B og C, peker den ned langs −z. Kollineære hjørner ville gitt nullvektor og ingen entydig flatenormal.<\/p><\/details><\/div>"}, {"id": "koordinater", "title": "Punkter, retninger og en ekstra koordinat", "source": "Transformations.pdf § 1.1–1.5, PDF s. 3–15 · CGVIZ_Chapter_3_2022.pdf s. 3–31", "html": "\n          <p>En vektor fra A til B er forskjellen B − A. Flytt begge endepunktene like langt, så er forskjellen den samme. I <dfn>homogene koordinater<\/dfn> får et 2D-punkt formen [x, y, 1]ᵀ og en retning formen [u, v, 0]ᵀ. I 3D setter vi inn z før siste koordinat.<\/p>\n          <p>Bruk kolonnevektorer. Radene i en affin 2D-matrise kan skrives [a, b, tₓ], [c, d, tᵧ], [0, 0, 1]. Punktet får x′ = ax + by + tₓ og y′ = cx + dy + tᵧ. Forskyvningen faller bort når siste koordinat er 0.<\/p>\n          <p><strong>Regn selv underveis.<\/strong> For punktet (2,4) med homogen koordinat én får vi <math display=\"block\"><mo>[<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><mtd><mn>−1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>4<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>=<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>7<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><\/math> Retningen (2, 4) får verdien (4, 4). En <dfn>affin transformasjon<\/dfn> bevarer blant annet midtpunkter. Generell skalering kan endre både lengder og vinkler.<\/p>\n          <p>En kube med åtte unike hjørner får en 4 × 8-hjørnematrise, ett homogent punkt per kolonne. Skalering med (2, 3, 4) er en 4 × 4-matrise med diagonal (2, 3, 4, 1) og null ellers. En translasjon har enerdiagonal og forskyvningen (tₓ, tᵧ, t<sub>z<\/sub>) øverst i siste kolonne. Produktet M · hjørnematrisen har fortsatt fire rader og åtte kolonner. Alle w-verdiene forblir 1 ved disse affine operasjonene.<\/p>\n          <p>En affin matrise kan bygges ved å spørre hvor origo og de to basisretningene havner. De to første kolonnene er de nye basisretningene. Den siste er bildet av origo. Dette gir en geometrisk kontroll på hver enkelt koeffisient.<\/p>\n          <details class=\"sjekk\"><summary>Grunnøving · Hvordan representerer du en retning?<\/summary><p>Trekk ett homogent punkt fra et annet.<\/p><details><summary>Se svar<\/summary><p>[4,3,1]ᵀ − [1,2,1]ᵀ = [3,1,0]ᵀ. Siste koordinat null gjør retningen upåvirket av translasjon.<\/p><\/details><\/details>\n          <div class=\"exercise\"><strong>Anvendelse · egen treningsoppgave<\/strong><p>En transformasjon sender origo til (4, −2), enhetsretningen langs x til (0, 2) og enhetsretningen langs y til (−1, 0). Hvor havner punktet (3, 1)?<\/p>\n          <details><summary>Hint<\/summary><p>Start på det nye origo. Gå deretter tre nye x-skritt og ett nytt y-skritt.<\/p><\/details>\n          <details><summary>Se svar<\/summary><p>(4, −2) + 3(0, 2) + (−1, 0) = (3, 4). Retningen (3, 1) alene ville blitt (−1, 6). Forskjellen er akkurat forskyvningen.<\/p><\/details><\/div>"}, {"id": "rekkefolge", "title": "Hva skjer først?", "source": "CGVIZ_Chapter_3_2022.pdf s. 10–20, 26–31 og 48–55 · CGVIZ_Chapter_5_2026.pdf s. 12–19", "html": "\n<p>S angir skalering, R rotasjon, T translasjon. Med x mot høyre og y opp er positiv rotasjon mot klokken, sett fra positiv z mot origo. Rotasjon i xy-planet gir x′ = x cos θ − y sin θ og y′ = x sin θ + y cos θ. Ved +90° får vi (−y, x). I 3D lar R<sub>z<\/sub> z stå fast.<\/p>\n<p>Skaler (1, 2) med faktorene (2, 3), roter +90° og flytt med (4, 1). Følg punktet: (1, 2) → (2, 6) → (−6, 2) → (−2, 3). Produktet er M = T R S. Høyre matrise treffer punktet først.<\/p>\n<p>Kontroll av hele matrisen: (x, y) → (2x, 3y) → (−3y, 2x) → (4 − 3y, 1 + 2x). Les av radene i M som [0, −3, 4], [2, 0, 1], [0, 0, 1]. Omvendt transformasjon er S⁻¹ R⁻¹ T⁻¹. Prøv den på resultatet.<\/p>\n<p>Skal et ferdig skalert hjørne Q = (4, 3) treffe G = (1, 8), finn forskyvningen G − Q = (−3, 5) og bruk den på alle hjørner. Speiling om x-aksen er derimot skalering med (1, −1). En skjærtransformasjon langs x, x′ = x + ky, y′ = y, flytter (1, 2) til (5, 2) når k = 2.<\/p>\n<div data-demo=\"transformasjon\"><\/div>\n<aside class=\"worked-example\" lang=\"nb\"><h3>Sett sammen en modellmatrise<\/h3><p>Start med et kolonnepunkt (1, 2). Skaler med (2, 3), roter 90° mot klokken og flytt deretter med (4, 1). Leser du operasjonene fra punktet og utover, får du M = TRS. Translasjonen står i siste kolonne fordi den multipliseres med den homogene koordinaten.<\/p>\n<div class=\"calculation\"><math display=\"block\"><mo>[<\/mo><mtable><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>-3<\/mn><\/mtd><mtd><mn>4<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>0<\/mn><\/mtd><mtd><mn>0<\/mn><\/mtd><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><mtr><mtd><mn>2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><mo>=<\/mo><mo>[<\/mo><mtable><mtr><mtd><mn>-2<\/mn><\/mtd><\/mtr><mtr><mtd><mn>3<\/mn><\/mtd><\/mtr><mtr><mtd><mn>1<\/mn><\/mtd><\/mtr><\/mtable><mo>]<\/mo><\/math><\/div><p>Hva endres hvis inndata er en retning?<\/p><details><summary>Kontroller resonnementet<\/summary><p>Sett w = 0. Første rad gir −3 × 2 = −6, og andre rad gir 2 × 1 = 2. Translasjonen faller bort, så retningen blir (−6, 2).<\/p><\/details><\/aside>\n<p>En matrise virker i koordinatsystemet som inngangsvektoren er uttrykt i. Å flytte et objekt før en skalering skalerer derfor også avstanden fra objektet til origo. Test rekkefølgen på origo dersom de oppgitte transformasjonene virker lette å forveksle.<\/p>\n<details class=\"sjekk\"><summary>Grunnøving · Hvilken matrise virker først i RS?<\/summary><p>Sett parentes rundt produktet som treffer punktet.<\/p><details><summary>Se svar<\/summary><p>(RS)p = R(Sp). S virker først.<\/p><\/details><\/details>\n<div class=\"exercise\"><strong>Anvendelse · egen treningsoppgave<\/strong><p>Skaler x med 3 og flytt så 2 langs x. Hvilken verdi får punktet med x = 1 ved riktig og omvendt rekkefølge?<\/p>\n<details><summary>Hint<\/summary><p>Skriv de to funksjonene som s(x) og t(x).<\/p><\/details>\n<details><summary>Se svar<\/summary><p>t(s(1)) = 3 + 2 = 5. s(t(1)) = 3(1 + 2) = 9. Med kolonnevektorer er den første sammensetningen TS. Inversen må først trekke fra 2, så dele på 3.<\/p><\/details><\/div>"}, {"id": "pivot", "title": "Rotasjon om et annet sentrum", "source": "Transformations.pdf § 1.6 og § 1.8, PDF s. 15–17 og 29–36 · CGVIZ_Chapter_3_2022.pdf s. 32–35 og 67–80", "html": "\n          <p>Et <dfn>rotasjonssentrum<\/dfn> C skal ligge stille. Flytt C til origo med T(−C), roter der og flytt tilbake. Formelen for et punkt er <math><mi mathvariant=\"bold\">p′<\/mi><mo>=<\/mo><mi mathvariant=\"bold\">C<\/mi><mo>+<\/mo><mi mathvariant=\"bold\">R<\/mi><mo>(<\/mo><mi mathvariant=\"bold\">p<\/mi><mo>−<\/mo><mi mathvariant=\"bold\">C<\/mi><mo>)<\/mo><\/math>. Matrisen er T(C) R T(−C).<\/p>\n          <p>Roter (5, 3) <em>med<\/em> klokken om (2, 2). Relativ posisjon er (3, 1). Ved −90° blir (x, y) til (y, −x), altså (1, −3). Legg tilbake (2, 2) og få (3, −1). Kontroller at C selv gir null i mellomste steg.<\/p>\n          <p>Rundt en akse parallell med z bruker du samme oppskrift og beholder z. For en vilkårlig 3D-akse gjennom C kan en rotasjon A først rette aksen inn mot z. Hele produktet blir T(C) A⁻¹ R<sub>z<\/sub>(θ) A T(−C). Når rotasjonen kommer etter en skalering, bruk sentrum i det koordinatsystemet oppgaven oppgir for rotasjonssteget.<\/p>\n          <p>Trekk pivoten fra hvert punkt før rotasjonen. Da er forskjellen en retning med pivoten som utgangspunkt. Etter rotasjonen må du legge pivoten tilbake i samme koordinatsystem. Både pivotposisjonen og avstanden til den skal være bevart.<\/p>\n          <details class=\"sjekk\"><summary>Grunnøving · Hvor skal pivotpunktet havne?<\/summary><p>Sett p = C i uttrykket C + R(p − C).<\/p><details><summary>Se svar<\/summary><p>Differansen blir null, så utgangen er C. Et annet resultat avslører feil rekkefølge eller fortegn.<\/p><\/details><\/details>\n          <div class=\"exercise\"><strong>Anvendelse · egen treningsoppgave<\/strong><p>Roter P = (3, 4) om C = (2, 2) med 90° med klokken. Kontroller svaret uten å bruke matrisen om igjen.<\/p>\n          <details><summary>Hint<\/summary><p>En kvart omdreining med klokken sender (u, v) til (v, −u).<\/p><\/details>\n          <details><summary>Se svar<\/summary><p>Forskjellen (1, 2) blir (2, −1). Legg til C og få (4, 1). Kvadrert avstand til C er 1² + 2² = 5 før og 2² + (−1)² = 5 etterpå.<\/p><\/details><\/div>"}, {"id": "akse", "title": "Roter om en vilkårlig akse", "source": "CGVIZ_Chapter_3_2022.pdf s. 66–80 · Transformations.pdf § 1.7", "html": "<p>En romakse trenger både et punkt C og en retning n. Velg en lokal ortonormal basis med tredje akse langs n. Med basisvektorene som kolonner tar B lokale koordinater til verden. Bᵀ gjør det motsatte fordi aksene er ortonormale. Velg en hjelpevektor som ikke er parallell med n for å konstruere de andre aksene med kryssprodukter.<\/p><p>Flytt relativt til C, bytt basis, roter om lokal z, bytt tilbake og legg til C. Dette gir C + B R<sub>z<\/sub>(θ) Bᵀ(p−C). For verdens x-akse kan du velge lokal basis (verdens y, verdens z, verdens x). Med C=(1,1,0), p=(1,2,0) er p−C en lokal x-enhet. En positiv kvart omdreining gir en lokal y-enhet, altså verdens +z. Resultatet er (1,1,1).<\/p>\n          <details class=\"sjekk\"><summary>Grunnøving · Hvorfor normalisere rotasjonsaksen?<\/summary><p>Sammenlign n og 3n som geometriske akser.<\/p><details><summary>Se svar<\/summary><p>Begge peker langs samme akse. Enhetslengde gjør basisbyttet ortonormalt uten å skalere rommet.<\/p><\/details><\/details>\n          <div class=\"exercise\"><strong>Anvendelse · egen treningsoppgave<\/strong><p>Hva skjer med punktet (4,1,0) på samme akse?<\/p><details><summary>Hint<\/summary><p>Beregn komponentene relativt til C.<\/p><\/details><details><summary>Se svar<\/summary><p>Differansen er 3n, altså (0,0,3) i lokal basis. Rotasjon om lokal z lar denne stå. Resultatet er (4,1,0) for enhver vinkel.<\/p><\/details><\/div>"}, {"id": "kostnad", "title": "Én matrise til alle hjørnene", "source": "Transformations.pdf § 1.4 og § 1.12, PDF s. 10–12 og 46–47 · CGVIZ_Chapter_3_2022.pdf s. 18–20", "html": "\n          <p>En tett 4 × 4-matrise ganger én 4-vektor krever 4 · 4 = 16 skalare multiplikasjoner. To tette 4 × 4-matriser krever 4 · 4 · 4 = 64 for å danne produktet. Disse tallene gjelder når en også regner med nuller og enere.<\/p>\n          <p>For 20 hjørner og to transformasjoner: separat bruk koster 20 · 2 · 16 = 640. Med forhåndsprodukt koster det 64 + 20 · 16 = 384. Rekkefølgen er identisk. Besparelsen er 256 multiplikasjoner fordi samme produkt brukes flere ganger. Med N hjørner lønner det seg når 64 + 16N &lt; 32N, altså N &gt; 4.<\/p>\n          <p>Forhåndsberegning har en engangskostnad og en besparelse per hjørne. Sammenlign disse separat. En ny modellmatrise hver bilderamme betyr at engangskostnaden kommer én gang per ramme.<\/p>\n          <details class=\"sjekk\"><summary>Grunnøving · Hvor mange produkter kreves for én utgangsrad?<\/summary><p>Tell komponentpar i en tett 4-vektor.<\/p><details><summary>Se svar<\/summary><p>Én rad trenger fire produkter. Fire rader trenger til sammen 16.<\/p><\/details><\/details>\n          <div class=\"exercise\"><strong>Anvendelse · egen treningsoppgave<\/strong><p>Hvor mange hjørner må to tette 4 × 4-matriser deles av før sammensetting gir en streng gevinst i antall multiplikasjoner?<\/p>\n          <details><summary>Hint<\/summary><p>Sett 64 + 16n opp mot 32n.<\/p><\/details>\n          <details><summary>Se svar<\/summary><p>64 + 16n < 32n gir n > 4. Ved fire er det uavgjort. Ved fem kreves 144 mot 160 multiplikasjoner. Dette regnestykket bruker tett multiplikasjon uten spesialbehandling av nuller.<\/p><\/details><\/div>"}], "question": "Skaler P = (3, 1) med (2, 1), og roter deretter +90° om C = (2, 0). Finn sluttpunktet og skriv matrisefaktorene i rett rekkefølge.", "hint": "Finn først det skalerte punktet. Trekk fra C før du roterer.", "answer": "Skaleringen gir (6, 1). Relativt til C er dette (4, 1). Kvartdreiningen gir (−1, 4). Legg til C og få (1, 4). Matriseproduktet er T(C) R(+90°) T(−C) S.", "terms": {"homogene koordinater": "En ekstra koordinat w gjør blant annet translasjon til matrisemultiplikasjon. For w ≠ 0 får vi vanlige koordinater ved å dele de øvrige på w.", "affin transformasjon": "En avbildning p′ = Ap + t. En rett linje avbildes på en linje eller, i et degenerert tilfelle, et punkt.", "rotasjonssentrum": "Punktet en 2D-rotasjon dreier rundt. Det beholder sin posisjon."}}, "refs": [{"id": "H24-02-a", "aar": 2024, "anker": "rekkefolge", "nb": "Sett sammen skalering og rotasjon", "en": "Compose scaling and rotation", "sourceNb": "TDT4195-Autumn2024_NoAnswers.pdf · s. 7 · nr. 2 (CG1-Q1)", "sourceEn": "TDT4195-Autumn2024_NoAnswers.pdf · p. 7 · no. 2 (CG1-Q1)"}, {"id": "H24-02-b", "aar": 2024, "anker": "kostnad", "nb": "Tell multiplikasjoner med og uten sammensetting", "en": "Count multiplications with and without composition", "sourceNb": "TDT4195-Autumn2024_NoAnswers.pdf · s. 7 · nr. 2 (CG1-Q1)", "sourceEn": "TDT4195-Autumn2024_NoAnswers.pdf · p. 7 · no. 2 (CG1-Q1)"}, {"id": "H25-02-a", "aar": 2025, "anker": "rekkefolge", "nb": "Skaler trekantens tre kolonnepunkter", "en": "Scale the triangle's three column-vector vertices", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 3 · nr. 2 (CG1-Q1)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 3 · no. 2 (CG1-Q1)"}, {"id": "H25-02-b", "aar": 2025, "anker": "rekkefolge", "nb": "Plasser det skalerte hjørnet ved et målpunkt", "en": "Place the scaled vertex at a target point", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 3 · nr. 2 (CG1-Q1)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 3 · no. 2 (CG1-Q1)"}, {"id": "H25-02-c", "aar": 2025, "anker": "pivot", "nb": "Roter om det allerede flyttede hjørnet", "en": "Rotate about the already translated vertex", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 3 · nr. 2 (CG1-Q1)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 3 · no. 2 (CG1-Q1)"}, {"id": "H25-03", "aar": 2025, "anker": "rekkefolge", "nb": "Ordne tre matriser for kolonnevektorer", "en": "Order three matrices for column vectors", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 4 · nr. 3 (CG1-Q2)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 4 · no. 3 (CG1-Q2)"}, {"id": "H25-04-a", "aar": 2025, "anker": "koordinater", "nb": "Bygg 3D-skaleringsmatrisen", "en": "Construct the 3D scaling matrix", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 5–6 · nr. 4 (CG1-Q3)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 5–6 · no. 4 (CG1-Q3)"}, {"id": "H25-04-b", "aar": 2025, "anker": "pivot", "nb": "Bygg 3D-rotasjon rundt forskjøvet sentrum", "en": "Construct a 3D rotation about a displaced centre", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 5–6 · nr. 4 (CG1-Q3)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 5–6 · no. 4 (CG1-Q3)"}, {"id": "H25-04-c", "aar": 2025, "anker": "koordinater", "nb": "Bygg homogen 3D-translasjon", "en": "Construct a homogeneous 3D translation", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 5–6 · nr. 4 (CG1-Q3)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 5–6 · no. 4 (CG1-Q3)"}, {"id": "H25-04-d", "aar": 2025, "anker": "koordinater", "nb": "Les størrelsen på en homogen hjørnematrise", "en": "Determine the dimensions of a homogeneous vertex matrix", "sourceNb": "TDT4195-Autumn2025_NoAnswers.pdf · s. 5–6 · nr. 4 (CG1-Q3)", "sourceEn": "TDT4195-Autumn2025_NoAnswers.pdf · p. 5–6 · no. 4 (CG1-Q3)"}]};
let lang = 'en';
const main = document.querySelector('main');
const popover = document.querySelector('.definition');
let lastTerm;
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const word = (en,nb) => lang === 'en' ? en : nb;
  function drawing(canvas, draw) {
    const paint = () => {
      const box = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(box.width * ratio));
      canvas.height = Math.max(1, Math.round(box.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      draw(ctx, box.width, box.height);
    };
    new ResizeObserver(paint).observe(canvas);
    paint();
    return paint;
  }
  function line(ctx, a, b, color, width = 1) {
    ctx.beginPath();
    ctx.moveTo(...a);
    ctx.lineTo(...b);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }
  function transform(widget) {
    widget.innerHTML =
      (lang === "en" ? "<h3>Try the matrix order</h3><p>The grey triangle starts with the vertex P = (1, 1). Translate along x and rotate about the origin. The green triangle shows the result.</p><canvas style=\"aspect-ratio:1.75\" role=\"img\" aria-label=\"Triangles in a coordinate system with x pointing right and y pointing up\"></canvas><div class=\"controls\"><label>Rotation <select class=\"angle\"><option>0</option><option selected>90</option><option>180</option><option>270</option></select> \u00b0</label><label>Translation <input class=\"shift\" type=\"range\" min=\"-3\" max=\"3\" value=\"2\"></label><label>Order <select class=\"order\"><option value=\"tr\">Rotate, then translate</option><option value=\"rt\">Translate, then rotate</option></select></label></div><output aria-live=\"polite\"></output>" : "<h3>Pr\u00f8v matriserekkef\u00f8lgen</h3><p>Den gr\u00e5 trekanten starter med hj\u00f8rnet P = (1, 1). Flytt langs x og roter om origo. Den gr\u00f8nne trekanten viser resultatet.</p><canvas style=\"aspect-ratio:1.75\" role=\"img\" aria-label=\"Trekanter i et koordinatsystem med x mot h\u00f8yre og y opp\"></canvas><div class=\"controls\"><label>Rotasjon <select class=\"angle\"><option>0</option><option selected>90</option><option>180</option><option>270</option></select> \u00b0</label><label>Flytting <input class=\"shift\" type=\"range\" min=\"-3\" max=\"3\" value=\"2\"></label><label>Rekkef\u00f8lge <select class=\"order\"><option value=\"tr\">Roter, s\u00e5 flytt</option><option value=\"rt\">Flytt, s\u00e5 roter</option></select></label></div><output aria-live=\"polite\"></output>");
    const draw = drawing(widget.querySelector("canvas"), (ctx, w, h) => {
      const degrees = Number(widget.querySelector(".angle").value);
      const shift = Number(widget.querySelector(".shift").value);
      const tr = widget.querySelector(".order").value === "tr";
      const cos = Math.round(Math.cos((degrees * Math.PI) / 180)),
        sin = Math.round(Math.sin((degrees * Math.PI) / 180));
      const rotate = ([x, y]) => [cos * x - sin * y, sin * x + cos * y];
      const move = ([x, y]) => [x + shift, y];
      const vertices = [
          [1, 1],
          [3, 1],
          [1, 2],
        ],
        changed = vertices.map((p) => (tr ? move(rotate(p)) : rotate(move(p))));
      const step = Math.min(w / 14, h / 14),
        center = [w / 2, h / 2];
      const px = ([x, y]) => [center[0] + x * step, center[1] - y * step];
      for (let k = -6; k <= 6; k++) {
        line(
          ctx,
          px([k, -6]),
          px([k, 6]),
          k ? "#d0dcd1" : "#587065",
          k ? 1 : 1.4,
        );
        line(
          ctx,
          px([-6, k]),
          px([6, k]),
          k ? "#d0dcd1" : "#587065",
          k ? 1 : 1.4,
        );
      }
      function triangle(v, fill, stroke, label) {
        ctx.beginPath();
        ctx.moveTo(...px(v[0]));
        v.slice(1).forEach((p) => ctx.lineTo(...px(p)));
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = stroke;
        const [x, y] = px(v[0]);
        ctx.fillText(label, x + 4, y + 14);
      }
      ctx.font = "12px Consolas, monospace";
      triangle(vertices, "#828c882c", "#556963", "P");
      triangle(changed, "#6aa56c55", "#236e46", "P′");
      const first = tr ? rotate(vertices[0]) : move(vertices[0]);
      widget.querySelector("output").textContent =
        "tₓ = " +
        shift +
        " · P = (1, 1) → (" +
        first.join(", ") +
        ") → P′ = (" +
        changed[0].join(", ") +
        (lang === "en" ? "). With column vectors: " : "). Med kolonnevektorer: ") +
        (tr ? "P′ = T · R · P" : "P′ = R · T · P") +
        ".";
    });
    widget.addEventListener("input", draw);
  }

function hideDefinition() {
  popover.hidden = true;
  lastTerm?.setAttribute('aria-expanded','false');
}
function render(next, restore = true) {
  const oldSection = [...main.querySelectorAll('section[id]')].filter(el => el.getBoundingClientRect().top <= 120).pop();
  const old = { y:scrollY, id:oldSection?.id, offset:oldSection?.getBoundingClientRect().top,
    details:[...main.querySelectorAll('details')].map(el=>el.open),
    controls:[...main.querySelectorAll('select,input')].map(el=>el.value) };
  lang = next;
  document.documentElement.lang = lang;
  const ch = data[lang];
  document.title = ch.title + word(' · translation comparison',' · oversettelsessammenligning');
  document.querySelector('.skip').textContent = word('Skip to content','Hopp til innhold');
  document.querySelector('.language-toggle').setAttribute('aria-label',word('Language','Språk'));
  for (const code of ['en','nb']) document.getElementById(code).setAttribute('aria-pressed',String(code===lang));
  hideDefinition();
  main.innerHTML = '<p class="preview-note">' + word(
    'Translation comparison: this complete chapter has been translated and reviewed manually. The rest of the bilingual site is still in progress. The original Norwegian site remains available.',
    'Oversettelsessammenligning: Hele dette kapitlet er oversatt og gjennomgått manuelt. Resten av det tospråklige nettstedet er fortsatt under arbeid. Det opprinnelige norske nettstedet er tilgjengelig.') +
    ' <a href="../../visdat/tema.html?k=transformasjoner">' + word('Open the original chapter','Åpne det opprinnelige kapitlet')+'</a></p>'+
    '<header class="page-head"><p class="eyebrow">Computer Graphics</p><h1>'+esc(ch.title)+'</h1><p>'+esc(ch.intro)+'</p></header>'+
    '<nav aria-label="'+word('Chapter sections','Kapittelavsnitt')+'"><ul>'+ch.sections.map(s=>'<li><a href="#'+s.id+'">'+esc(s.title)+'</a></li>').join('')+'</ul></nav>'+
    '<section class="focus" id="fokus"><h2>'+word('Exam focus','Eksamensfokus')+'</h2><ul>'+ch.focus.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></section>'+
    '<p class="page-note">'+word('Numerical convention: the examples retain the original decimal commas. Semicolons separate vector components where decimal commas are used.','Tallkonvensjon: Eksemplene beholder de opprinnelige desimalkommaene. Semikolon skiller vektorkomponenter når desimalkomma brukes.')+'</p>'+
    ch.sections.map(s=>'<section id="'+s.id+'"><h2>'+esc(s.title)+'</h2>'+s.html+'<p class="source">'+esc(s.source)+'</p>'+references(s.id)+'</section>').join('')+
    '<section id="eksamensoppgaver"><h2>'+word('Past exam questions','Tidligere oppgaver')+'</h2><p>'+word('Original references: exam number and PDF page are listed below. The linked practice page still uses the original Norwegian interface.','Originalreferanser: Oppgavenummer og PDF-side står nedenfor. Treningssiden det lenkes til, bruker fortsatt det opprinnelige norske grensesnittet.')+'</p>'+references()+'</section>'+
    '<section class="exercise" id="prov"><p class="eyebrow">'+word('NEW PRACTICE EXERCISE','NY TRENINGSOPPGAVE')+'</p><h2>'+word('Try it yourself','Prøv selv')+'</h2><p>'+esc(ch.question)+'</p><details><summary>Hint</summary><p>'+esc(ch.hint)+'</p></details><details><summary>'+word('Show answer','Se svar')+'</summary><p><b>'+word('Our proposed solution','Eget løsningsforslag')+'</b></p><p>'+esc(ch.answer)+'</p></details></section>'+
    '<section id="preview-glossary"><h2>'+word('Chapter glossary','Begreper i kapitlet')+'</h2><dl>'+Object.entries(ch.terms).map(([term,definition])=>'<dt>'+esc(term)+'</dt><dd>'+esc(definition)+'</dd>').join('')+'</dl></section>';
  main.querySelectorAll('[data-demo="transformasjon"]').forEach(widget => {widget.classList.add('widget');transform(widget);});
  main.querySelectorAll('dfn').forEach(term => {
    const label = term.textContent;
    const definition = ch.terms[label];
    if (!definition) throw Error('Missing definition: '+label);
    const button = document.createElement('button');
    button.className = 'term'; button.type = 'button'; button.textContent = label;
    button.setAttribute('aria-expanded','false');
    button.onclick = () => {
      const close = lastTerm===button && !popover.hidden;
      hideDefinition(); if (close) return;
      lastTerm = button;
      popover.querySelector('strong').textContent = label;
      popover.querySelector('p').textContent = definition;
      button.setAttribute('aria-expanded','true'); popover.hidden = false;
    };
    term.replaceWith(button);
  });
  popover.querySelector('button').setAttribute('aria-label',word('Close definition','Lukk definisjon'));
  if (restore) {
    main.querySelectorAll('select,input').forEach((el,i)=>{if(old.controls[i]!==undefined){el.value=old.controls[i];el.dispatchEvent(new Event('input',{bubbles:true}));}});
    main.querySelectorAll('details').forEach((el,i)=>{el.open=old.details[i]||false;});
    const section = old.id && document.getElementById(old.id);
    requestAnimationFrame(()=>window.scrollTo({top:section ? scrollY+section.getBoundingClientRect().top-old.offset : old.y,behavior:'instant'}));
  }
}
function references(anchor) {
  const rows = data.refs.filter(row=>!anchor||row.anker===anchor);
  if (!rows.length) return '';
  return '<details><summary>'+word('Practise with past exam questions','Tren med tidligere eksamensoppgaver')+' ('+rows.length+')</summary><ul>'+rows.map(row=>'<li><a href="../../visdat/eksamen.html?aar='+row.aar+'&amp;id='+row.id+'">'+row.id+'</a> · '+esc(row[lang])+'<p class="source">'+esc(row[lang==='en'?'sourceEn':'sourceNb'])+'</p></li>').join('')+'</ul></details>';
}
for (const code of ['en','nb']) document.getElementById(code).onclick = () => render(code);
popover.querySelector('button').onclick = () => {hideDefinition();lastTerm?.focus();};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){hideDefinition();lastTerm?.focus();}});
render('en',false);
if(location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
</script>
